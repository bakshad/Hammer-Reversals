name: 🚀 Live Sniper Engine

on:
  schedule:
    # 04:00 UTC is exactly 09:30 AM IST. Runs Monday-Friday.
    - cron: '0 4 * * 1-5'
  workflow_dispatch: 

# Needed to push the EOD CSV logs back to your repository
permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    # Hard stop at 360 minutes (6 hours) to prevent stuck runners
    timeout-minutes: 360 

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pytz

      - name: 🎯 Execute Sniper Engine
        run: python main.py
        
      - name: 💾 Save Engine Data (Commit to Repo)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Automated Daily EOD Data Sync"
          file_pattern: "*.csv *.json"
